<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B1E1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>VotEra</title>
<style>
:root{--maroon:#7B1E1E;--gold:#B8860B;--bg:#FBF8F5;--card:#fff;--ink:#241f1d;--mut:#6b6460;--line:#E6DED6;--chip:#F1EAE3;--green:#2E7D32;--red:#B3261E;--amber:#B26A00;--bar:#7B1E1E}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171413;--card:#221E1C;--ink:#F2ECE7;--mut:#B3A9A2;--line:#3a3330;--chip:#2e2826;--green:#6fbf73;--red:#f2807a;--amber:#e0a04a;--bar:#d98a8a}}:root[data-theme=dark]{--bg:#171413;--card:#221E1C;--ink:#F2ECE7;--mut:#B3A9A2;--line:#3a3330;--chip:#2e2826;--green:#6fbf73;--red:#f2807a;--amber:#e0a04a;--bar:#d98a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#d9d0c7;color:var(--ink);display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:#0e0c0b}}:root[data-theme=dark] body{background:#0e0c0b}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 28px));background:var(--bg);border-radius:46px;border:12px solid #151515;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:22px;background:#151515;border-radius:0 0 16px 16px;z-index:80}
.status{height:30px;flex:none;display:flex;justify-content:space-between;padding:8px 24px 0;font-size:12px;font-weight:600;color:#fff;background:var(--maroon)}
@media (max-width:520px){body{background:var(--bg);display:block}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.notch,.status{display:none}}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
header{flex:none;background:var(--maroon);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header .logo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#faf8f6}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px}
header button{background:transparent;border:0;color:#fff;padding:6px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
header button:active{background:rgba(255,255,255,.18)}
main{flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
nav.tabs{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button.on{color:var(--maroon);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav.tabs button.on{color:var(--bar)}}:root[data-theme=dark] nav.tabs button.on{color:var(--bar)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}.card.tap:active{background:var(--chip)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.b{font-weight:700}.sm{font-size:12.5px}.xs{font-size:11.5px}.mut{color:var(--mut)}
h2{font-size:16px;margin:2px 0 8px}h3{font-size:14px;margin:0 0 6px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mut);margin:3px 4px 0 0}
.tag.ok{background:rgba(46,125,50,.15);color:var(--green)}.tag.red{background:rgba(179,38,30,.14);color:var(--red)}.tag.gold{background:rgba(184,134,11,.18);color:var(--amber)}
.btn{border:0;border-radius:99px;padding:10px 18px;font:inherit;font-weight:700;background:var(--maroon);color:#fff;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.out{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.out{color:var(--bar);border-color:var(--bar)}}:root[data-theme=dark] .btn.out{color:var(--bar);border-color:var(--bar)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}.btn.block{width:100%}
.btn.txt{background:transparent;color:var(--maroon);padding:6px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.txt{color:var(--bar)}}:root[data-theme=dark] .btn.txt{color:var(--bar)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--maroon)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center}
.ring{flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:5px;background:var(--card);border-radius:50%}
.ring span{position:relative;font-size:12px;font-weight:800}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .6s ease}
.bar.g>i{background:var(--green)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.open{background:rgba(46,125,50,.16);color:var(--green)}.pill.closed{background:rgba(179,38,30,.14);color:var(--red)}.pill.upcoming{background:rgba(184,134,11,.18);color:var(--amber)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;animation:slide .22s ease}
.sheet.modal{background:rgba(0,0,0,.5);justify-content:flex-end;z-index:40;animation:fade .18s ease}
.sheet.modal .panel{background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding:16px;animation:rise .22s ease}
.sheet.center{justify-content:center;padding:22px}.sheet.center .panel{border-radius:18px;max-height:86%}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(30px)}to{transform:none}}
.sheet .top{flex:none;display:flex;align-items:center;gap:6px;padding:10px 8px;background:var(--maroon);color:#fff}
.sheet .top button{background:transparent;border:0;color:#fff;padding:6px;cursor:pointer;display:grid;place-items:center}
.sheet .top b{flex:1;font-size:16px}
.sheet .body{flex:1;overflow-y:auto;padding:14px}
.toast{position:absolute;left:14px;right:14px;bottom:74px;background:#2b2523;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;z-index:90;animation:fade .15s ease;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.err{background:#8c1d18}
.banner{flex:none;background:#fff3d6;color:#6b4a00;padding:8px 14px;font-size:12.5px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 10px 8px}
.login{padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.big-logo{display:block;height:150px;width:auto;margin:6px auto 10px}
.seg{display:flex;background:var(--chip);border-radius:99px;padding:3px;margin:6px 0 4px}.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer}.seg button.on{background:var(--card);color:var(--maroon);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:12.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px}table.cmp td,table.cmp th{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}table.cmp th{font-size:11.5px;color:var(--mut);font-weight:600}
.scroll-x{overflow-x:auto}
.pre{white-space:pre-wrap;word-wrap:break-word}
input[type=range]{padding:0;border:0;accent-color:var(--maroon)}
.hl{background:rgba(255,193,7,.35);font-weight:700;border-radius:3px}
.sw{display:flex;align-items:center;gap:10px;margin:6px 0}.sw input{width:auto}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.proofs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.proof{aspect-ratio:1;border-radius:10px;background:var(--chip) center/cover;cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.lg-d{display:none}:root[data-theme=dark] .lg-d{display:block}:root[data-theme=dark] .lg-l{display:none}
.pwrap{position:relative}.pwrap input{padding-right:46px}.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);padding:6px;cursor:pointer;display:grid;place-items:center}
:root[data-theme=dark] .seg button.on{background:var(--maroon);color:#fff}
</style>
</head>
<body>
<noscript><p style="padding:20px">VotEra needs JavaScript. Please turn it on in your browser.</p></noscript>
<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="status"><span id="clock">9:41</span><span>VotEra</span></div>
  <div class="app" id="app"></div>
</div>
<script>
"use strict";
/* VotEra browser version. It uses the same server, accounts, scoring and votes as the Android app.
   Set ?api=http://127.0.0.1:8000 in the address to point it at another server (testing only). */
const API = (new URLSearchParams(location.search).get("api") || "https://votera-backend.onrender.com").replace(/\/$/, "");
const SSC = ["President","Vice President","Secretary-General","Treasurer","Auditor","Publicity and Communications Councilor (PCC)","Creatives and Media Councilor (CMC)","Students' Rights and Welfare Councilor (STRAWC)","Academics and Research Councilor (ARC)","Gender and Development Councilor (GADC)","External Affairs and Partnership Councilor (EAPC)","Logistics and Technical Councilor (LTC)"];
const PROGRAMS = ["BSIT","BTLEd - Home Economics","BTLEd - ICT","BSBA - HRM","BSBA - MM","BS Entrepreneurship","BPA - Fiscal Administration","DOMT - Medical Office Management"];
const OTHER = "Other (specify)";
const CATS = ["General","Schedule","Reminder","Rules","Results","Urgent"];
const ICON = {
  people:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18.5 14.8c1.6.8 2.5 2.4 2.5 5.2"/></svg>',
  compare:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="7.5" height="16" rx="2"/><rect x="13.5" y="4" width="7.5" height="16" rx="2"/></svg>',
  bell:'<svg class="i" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
  bars:'<svg class="i" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  shield:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  help:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>',
  out:'<svg class="i" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  moon:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.8C3.9 8.6 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};
const S = { token:null, user:null, stage:"login", portal:"student", otpToken:"", devOtp:"", tab:"candidates", sub:"overview",
  election:null, electionAt:0, cands:[], posts:[], results:null, vs:null, picks:{}, query:"", posFilter:"", sort:"default",
  compare:[], match:false, prio:[5,5,5,5], cmpPos:"", postCat:"All", busy:false, waking:false,
  turnout:[], quota:null, voters:[], sessions:[], audit:[], onlyProblems:false, selftest:null, vQuery:"", vFilter:"all", vProg:"", vShow:60,
  postSched:0, scroll:{} };
try { const t = sessionStorage.getItem("vt"), u = sessionStorage.getItem("vu"); if (t && u) { S.token = t; S.user = JSON.parse(u); S.stage = "main"; S.tab = S.user.role === "admin" ? "admin" : "candidates"; } } catch (e) {}

/* ---------- theme ---------- */
const isDark = () => document.documentElement.dataset.theme === "dark";
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem("vtheme", t); } catch (e) {} const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === "dark" ? "#4a1212" : "#7B1E1E"; }
(function () { let t = null; try { t = localStorage.getItem("vtheme"); } catch (e) {} if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; setTheme(t); })();
const themeBtn = () => `<button data-act="theme" aria-label="Switch between light and dark mode" title="Light / dark mode">${isDark() ? ICON.sun : ICON.moon}</button>`;
function pwField(id, ph, ac) { return `<div class="pwrap"><input id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}"><button type="button" data-act="showPw" aria-label="Show password" title="Show or hide password">${ICON.eye}</button></div>`; }
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "-" : String(Math.round(Number(n) * 10) / 10);
const posKey = p => String(p || "").trim().replace(/\s+/g, " ").toLowerCase();
const posRank = p => { const i = SSC.findIndex(n => posKey(n) === posKey(p)); return i >= 0 ? i : 100; };
const iso = s => new Date(/[zZ]$|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z");
function timeAgo(s) { try { const d = (Date.now() - iso(s).getTime()) / 1000; if (d < 60) return "Just now"; if (d < 3600) return Math.floor(d / 60) + " min ago"; if (d < 86400) return Math.floor(d / 3600) + " h ago"; if (d < 604800) return Math.floor(d / 86400) + " d ago"; return iso(s).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}); } catch (e) { return ""; } }
function localTime(s) { try { return iso(s).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch (e) { return s; } }
const isAdmin = () => S.user && S.user.role === "admin";
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 38% 38%)`; };
const initials = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
function avatar(c, size) { const key = c.photo_version > 0 ? `c:${c.id}:${c.photo_version}` : ""; return `<div class="av" data-photo="${key}" style="width:${size}px;height:${size}px;background-color:${hue(c.full_name)};font-size:${Math.round(size / 2.6)}px">${esc(initials(c.full_name))}</div>`; }
function ring(score, size = 46) { const ok = score != null; const col = !ok ? "var(--line)" : score >= 75 ? "var(--green)" : score >= 50 ? "var(--amber)" : "var(--red)"; return `<div class="ring" style="--p:${ok ? score : 0};--c:${col};width:${size}px;height:${size}px"><span>${ok ? fmt(score) : "-"}</span></div>`; }
function toast(msg, err) { const old = $("#toast"); if (old) old.remove(); const t = document.createElement("div"); t.id = "toast"; t.className = "toast" + (err ? " err" : ""); t.textContent = msg; $("#app").appendChild(t); setTimeout(() => { if (t.parentNode) t.remove(); }, err ? 5200 : 3000); }
function download(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
const groupByPos = list => { const m = new Map(); list.forEach(c => { const k = posKey(c.position); if (!m.has(k)) m.set(k, {name: c.position, items: []}); m.get(k).items.push(c); }); return [...m.values()].sort((a, b) => posRank(a.name) - posRank(b.name) || a.name.localeCompare(b.name)); };

/* ---------- network ---------- */
async function api(path, o = {}) {
  const h = {}; if (S.token) h.Authorization = "Bearer " + S.token;
  if (o.body !== undefined) h["Content-Type"] = "application/json";
  let r;
  try { r = await fetch(API + path, {method: o.method || "GET", headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined}); }
  catch (e) { throw new Error("Cannot reach the server. Check your connection. If the server was idle it may need a minute to wake up."); }
  if (r.status === 401 && S.token) { logout(); toast("Your session ended. Please sign in again.", true); throw new Error("Session ended"); }
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = typeof j.detail === "string" ? j.detail : Array.isArray(j.detail) ? j.detail.map(x => x.msg).join("; ") : m; } catch (e) {}
    const er = new Error(m); er.status = r.status; throw er;
  }
  if (o.raw) return r;
  return r.status === 204 ? null : r.json();
}
const blobCache = new Map();
function fetchBlob(key) {
  if (blobCache.has(key)) return blobCache.get(key);
  const [k, id] = key.split(":"); const path = k === "c" ? `/candidates/${id}/photo` : k === "a" ? `/announcements/${id}/image` : `/proofs/${id}/image`;
  const p = fetch(API + path, {headers: {Authorization: "Bearer " + S.token}}).then(r => r.ok ? r.blob() : Promise.reject()).then(b => URL.createObjectURL(b)).catch(() => { blobCache.delete(key); return null; });
  blobCache.set(key, p); return p;
}
function hydrate() {
  document.querySelectorAll("[data-photo]").forEach(async el => {
    const key = el.dataset.photo; if (!key || el.dataset.done === key) return;
    const url = await fetchBlob(key); if (!url || !el.isConnected) return;
    el.dataset.done = key; el.style.backgroundImage = `url(${url})`; if (el.classList.contains("av")) el.textContent = "";
  });
}

/* ---------- loading data ---------- */
async function loadCore() {
  const jobs = [api("/election").then(e => { S.election = e; S.electionAt = Date.now(); }), api("/candidates").then(c => S.cands = c), api("/announcements").then(a => S.posts = a), api("/results").then(r => S.results = r)];
  if (!isAdmin()) jobs.push(api("/vote/status").then(v => S.vs = v));
  const res = await Promise.allSettled(jobs);
  const bad = res.find(r => r.status === "rejected"); if (bad && S.token && bad.reason.message !== "Session ended") toast(bad.reason.message, true);
}
async function loadAdmin() {
  if (!isAdmin()) return;
  await Promise.allSettled([api("/admin/turnout").then(t => S.turnout = t), api("/admin/quota").then(q => S.quota = q), api("/admin/feedback").then(f => S.fb = f), api("/admin/voters").then(v => S.voters = v), api("/admin/sessions").then(s => S.sessions = s.sessions), api("/admin/audit-log?limit=120&only_problems=" + S.onlyProblems).then(a => S.audit = a)]);
}
async function refresh(quiet) { try { await loadCore(); if (isAdmin()) await loadAdmin(); } catch (e) { if (!quiet) toast(e.message, true); } render(); }
let rt = null; const refreshSoon = () => { clearTimeout(rt); rt = setTimeout(() => refresh(true), 500); };

/* live sync: the server tells every device when something changed */
let ws = null, wsOn = false;
function connectWs() {
  if (!S.token || wsOn) return; wsOn = true;
  try {
    ws = new WebSocket(API.replace(/^http/, "ws") + "/ws");
    ws.onopen = () => ws.send(JSON.stringify({token: S.token}));
    ws.onmessage = ev => { try { if (JSON.parse(ev.data).type === "changed") refreshSoon(); } catch (e) {} };
    ws.onclose = () => { wsOn = false; if (S.token) setTimeout(connectWs, 5000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  } catch (e) { wsOn = false; }
}

/* ---------- auth ---------- */
function logout() {
  S.token = null; S.user = null; S.stage = "login"; S.picks = {}; S.vs = null; S.otpToken = ""; S.devOtp = ""; S.tab = "candidates"; S.detail = null;
  try { sessionStorage.removeItem("vt"); sessionStorage.removeItem("vu"); } catch (e) {}
  try { if (ws) ws.close(); } catch (e) {} wsOn = false; closeSheets(); render();
}
async function doLogin() {
  const sn = $("#sn").value.trim().toUpperCase(), pw = $("#pw").value;
  if (S.portal === "student" && !/^\d{4}-\d{5}-CM-\d$/.test(sn)) return toast("Student number format is YYYY-NNNNN-CM-N, for example 2020-00000-CM-0", true);
  if (!sn || !pw) return toast("Enter your number and password", true);
  S.busy = true; render();
  try { const r = await api("/auth/login", {method: "POST", body: {student_number: sn, password: pw, portal: S.portal}}); S.otpToken = r.otp_token; S.devOtp = r.dev_otp; S.stage = "otp"; }
  catch (e) { toast(e.message, true); }
  S.busy = false; render();
}
async function doOtp() {
  const code = $("#otp").value.trim(); if (code.length !== 6) return toast("Enter the 6-digit code", true);
  S.busy = true; render();
  try {
    const r = await api("/auth/verify-otp", {method: "POST", body: {otp_token: S.otpToken, code}});
    S.token = r.access_token; S.user = r.user; S.stage = "main"; S.tab = r.user.role === "admin" ? "admin" : "candidates"; S.sub = "overview";
    try { sessionStorage.setItem("vt", S.token); sessionStorage.setItem("vu", JSON.stringify(S.user)); } catch (e) {}
    await refresh(true); connectWs();
  } catch (e) { toast(e.message, true); }
  S.busy = false; render();
}

/* ---------- rendering ---------- */
function render() {
  const app = $("#app"); const keep = $("main"); if (keep) S.scroll[S.tab + S.sub] = keep.scrollTop;
  const sheets = [...app.querySelectorAll(".sheet")].map(s => s.outerHTML);
  if (S.stage === "login") app.innerHTML = loginView();
  else if (S.stage === "otp") app.innerHTML = otpView();
  else app.innerHTML = mainView();
  if (S.stage === "main") { sheets.forEach(h => app.insertAdjacentHTML("beforeend", h)); const m = $("main"); if (m) { m.style.scrollBehavior = "auto"; m.scrollTop = S.scroll[S.tab + S.sub] || 0; m.style.scrollBehavior = ""; } }
  hydrate();
}

function otpView() {
  return `<header><button data-act="toLogin" aria-label="Back">${ICON.back}</button><h1>Verify it is you</h1>${themeBtn()}</header>
  <main><div class="login"><h2>Enter the 6-digit code</h2><div class="note">Simulated delivery: a real system would send this by SMS. For this prototype the code is shown here.<br><b class="mono" style="font-size:22px;letter-spacing:4px">${esc(S.devOtp)}</b></div>
  <input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" style="margin-top:10px;font-size:20px;letter-spacing:6px;text-align:center">
  <button class="btn out block" style="margin-top:8px" data-act="fillOtp">Fill in the code</button>
  <button class="btn block" style="margin-top:6px" data-act="otp" ${S.busy ? "disabled" : ""}>${S.busy ? "Checking..." : "Verify and continue"}</button></div></main>`;
}
function tabsDef() { const t = [["candidates", "Candidates", ICON.people], ["compare", "Compare", ICON.compare], ["updates", "Updates", ICON.bell], ["results", "Results", ICON.bars]]; if (isAdmin()) t.push(["admin", "Admin", ICON.shield]); return t; }

  <main id="main">${body}</main><nav class="tabs">${tabsDef().map(([id, l, ic]) => `<button class="${S.tab === id ? "on" : ""}" data-act="tab" data-v="${id}">${ic}${l}</button>`).join("")}</nav>`;

const statusPill = e => e ? `<span class="pill ${esc(e.status)}">${esc(e.status[0].toUpperCase() + e.status.slice(1))}</span>` : "";
function countdown() { const e = S.election; if (!e || e.seconds_left == null) return ""; const left = Math.max(0, e.seconds_left - Math.floor((Date.now() - S.electionAt) / 1000)); const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60; return (e.status === "open" ? "Voting closes in " : "Closing time set: ") + (h ? h + " h " : "") + m + " min " + String(s).padStart(2, "0") + " s"; }
function electionCard() {
  const e = S.election; if (!e) return `<div class="card"><div class="empty">Loading...</div></div>`;
  return `<div class="card"><div class="row"><div class="grow"><div class="b">${esc(e.title)}</div><div class="xs mut" id="cd">${esc(countdown())}</div></div>${statusPill(e)}</div>
  ${S.user.role === "student" ? `<div class="xs mut" style="margin-top:6px">${e.status === "open" ? "Open a candidate to read the profile and select. You vote once for each position." : e.status === "upcoming" ? "Voting opens soon. You can read the profiles now." : "Voting is closed. See the Results tab."}</div>` : ""}</div>`;
}
function ballotBar() {
  if (isAdmin() || !S.vs || !S.election || S.election.status !== "open" || S.vs.complete) return "";
  const pos = S.vs.positions, left = pos.filter(p => !p.voted), sel = left.filter(p => S.picks[posKey(p.position)]).length, done = pos.length - left.length;
  const next = left.find(p => !S.picks[posKey(p.position)]);
  return `<div class="card" style="background:var(--chip)"><div class="xs">Progress: ${done + sel} of ${pos.length} positions (${done} already submitted)</div><div class="bar" style="margin:5px 0 8px"><i style="width:${pos.length ? (done + sel) / pos.length * 100 : 0}%"></i></div>
  <div class="row"><div class="grow"><div class="b">Your ballot</div><div class="xs">${sel} of ${left.length} open positions selected</div>${next ? `<button class="btn txt" style="padding:0" data-act="nextPos" data-v="${esc(next.position)}">Next: ${esc(next.position)}</button>` : ""}</div><button class="btn" data-act="review" ${sel ? "" : "disabled"}>Review ballot</button></div></div>`;
}
function votedFor(position) { return S.vs && S.vs.positions.find(p => p.voted && posKey(p.position) === posKey(position)); }
function filteredCands() {
  let l = S.cands.slice(); const q = S.query.trim().toLowerCase();
  if (q) l = l.filter(c => [c.full_name, c.program, c.position].some(x => String(x).toLowerCase().includes(q)));
  if (S.posFilter) l = l.filter(c => posKey(c.position) === S.posFilter);
  if (S.sort === "cred") l.sort((a, b) => (b.credibility_score ?? -1) - (a.credibility_score ?? -1)); else if (S.sort === "name") l.sort((a, b) => a.full_name.localeCompare(b.full_name));
  return l;
}
function candCard(c) {
  const picked = S.picks[posKey(c.position)] === c.id, v = votedFor(c.position);
  return `<div class="card tap row" data-act="open" data-id="${c.id}">${avatar(c, 52)}<div class="grow"><div class="b">${esc(c.full_name)}${c.published === false ? ' <span class="tag red">DRAFT</span>' : ""}</div><div class="sm">${esc(c.position)}</div><div class="xs mut">${esc(c.program)}</div>
  ${isAdmin() && c.flagged ? '<span class="tag red">Flagged for review</span>' : ""}${picked ? '<span class="tag ok">Selected</span>' : ""}${v && v.candidate_id === c.id ? '<span class="tag ok">You voted</span>' : ""}</div>${ring(c.credibility_score)}</div>`;
}
function candList() {
  const l = filteredCands(); if (!l.length) return `<div class="empty">${S.cands.length ? "No candidate matches." : "No candidates yet."}</div>`;
  if (S.posFilter || S.sort !== "default") return l.map(candCard).join("");
  return groupByPos(l).map(g => `<h3 style="margin:12px 0 6px">${esc(g.name)}</h3>${g.items.map(candCard).join("")}`).join("");
}
function candidatesView() {
  const poss = groupByPos(S.cands);
  return `${electionCard()}${ballotBar()}
  <input id="q" placeholder="Search by name, program or position" value="${esc(S.query)}" data-in="query">
  <div class="row" style="margin:8px 0 2px"><span class="xs mut">Sort</span><select id="sortSel" data-in="sort" style="width:auto;padding:6px 10px"><option value="default" ${S.sort === "default" ? "selected" : ""}>Ballot order</option><option value="cred" ${S.sort === "cred" ? "selected" : ""}>Credibility, high to low</option><option value="name" ${S.sort === "name" ? "selected" : ""}>Name, A to Z</option></select></div>
  <div class="chips" id="posChips"><button class="chip ${S.posFilter ? "" : "on"}" data-act="posf" data-v="">All positions</button>${poss.map(g => `<button class="chip ${S.posFilter === posKey(g.name) ? "on" : ""}" data-act="posf" data-v="${esc(posKey(g.name))}">${esc(g.name.replace(/ \(.*\)/, ""))}</button>`).join("")}</div>
  <div id="list">${candList()}</div>`;
}

/* candidate profile */
function completeness(c) {
  const parts = [["manifesto", !!c.manifesto], ["photo", c.photo_version > 0], ["achievements", !!c.achievements], ["leadership", !!c.leadership], ["community involvement", !!c.community], ["verified documents", c.proof_count > 0], ["video or Q&A", !!(c.video_url || c.qa)]];
  return {filled: parts.filter(p => p[1]).length, total: parts.length, missing: parts.filter(p => !p[1]).map(p => p[0])};
}
function scoreBar(label, w, v) { return `<div style="margin:8px 0"><div class="row sm"><span class="grow">${label} <span class="mut">${w}</span></span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v == null ? 0 : v}%"></i></div></div>`; }
function detailHtml(c, proofs) {
  const cp = completeness(c), v = votedFor(c.position), open = S.election && S.election.status === "open", picked = S.picks[posKey(c.position)] === c.id;
  const block = (t, x) => x ? `<div class="card"><h3>${t}</h3><div class="pre sm">${esc(x)}</div></div>` : "";
  let act = "";
  if (!isAdmin()) act = v ? `<div class="note">You already voted for ${esc(c.position)}: <b>${esc(v.candidate_name || "")}</b>. A recorded vote cannot be changed.</div>`
    : open ? `<button class="btn block" data-act="pick" data-id="${c.id}">${picked ? "Selected. Tap to unselect" : "Select for " + esc(c.position.replace(/ \(.*\)/, ""))}</button>` : `<div class="note">Voting is not open.</div>`;
  return `<div class="body"><div class="hero">${avatar(c, 96)}<div class="b" style="font-size:19px;margin-top:10px">${esc(c.full_name)}</div><div class="sm">${esc(c.position)}</div><div class="xs mut">${esc(c.program)}</div></div>
  ${!isAdmin() && c.flagged ? `<div class="note" style="background:rgba(179,38,30,.12)">This manifesto is very similar to another candidate's (${fmt((c.highest_similarity || 0) * 100)}% similarity). It is being reviewed by the administrator, which is not a rejection.</div>` : ""}
  ${isAdmin() && c.most_similar_name ? `<div class="note">Most similar to: ${esc(c.most_similar_name)} (${fmt((c.highest_similarity || 0) * 100)}%)${c.flagged ? " | flagged" : ""} <button class="btn txt sm" data-act="sim" data-id="${c.id}">Compare texts</button></div>` : ""}

  const items = S.vs.positions.filter(p => !p.voted && S.picks[posKey(p.position)]); let ok = 0, err = "";
  for (const p of items) { try { await api("/vote", {method: "POST", body: {candidate_id: S.picks[posKey(p.position)]}}); delete S.picks[posKey(p.position)]; ok++; } catch (e) { err = e.message; if (e.status === 409) delete S.picks[posKey(p.position)]; } }

function postForm() {
  modal(`<h3>New update</h3><label class="f">Title</label><input id="pt" maxlength="120"><label class="f">Message</label><textarea id="pb" rows="4" maxlength="1000"></textarea><label class="f">Category</label><select id="pc">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
  <label class="f">Publish</label><select id="pw2"><option value="">Now</option><option value="5">In 5 minutes</option><option value="60">In 1 hour</option><option value="1440">In 1 day</option></select><label class="xs" style="display:block;margin:8px 0"><input type="checkbox" id="pp" style="width:auto"> Pin to the top</label>
  <div class="row"><button class="btn out grow" data-act="closeModal">Cancel</button><button class="btn grow" data-act="savePost">Post</button></div>`);
}
function scoresForm(id) {
  const c = S.cands.find(x => x.id === id); const v = k => c[k] ?? "";
  modal(`<h3>Scores for ${esc(c.full_name)}</h3><div class="xs mut">0 to 100, from the validated documents.</div><label class="f">Verified achievements (30%)</label><input id="s1" type="number" min="0" max="100" value="${v("achievements_score")}"><label class="f">Leadership experience (20%)</label><input id="s2" type="number" min="0" max="100" value="${v("leadership_score")}"><label class="f">Community involvement (15%)</label><input id="s3" type="number" min="0" max="100" value="${v("community_score")}">
  <div class="row" style="margin-top:10px"><button class="btn out grow" data-act="closeModal">Cancel</button><button class="btn grow" data-act="saveScores" data-id="${id}">Save</button></div>`);
}
async function simDialog(id) {
  try {
    const d = await api(`/admin/candidates/${id}/similarity`); const o = d.other;
    modal(`<h3>Similarity ${fmt(d.similarity * 100)}%</h3><div class="xs mut">${d.flagged ? "At or above the 70% threshold: flagged for review only, not rejected." : "Below the 70% threshold."} Originality = ${fmt(100 - d.similarity * 100)}.</div>
    ${o ? `<div class="card"><div class="b sm">${esc(d.candidate.full_name)}</div><div class="pre xs">${hl(d.candidate.manifesto, d.shared_terms)}</div></div><div class="card"><div class="b sm">${esc(o.full_name)}</div><div class="pre xs">${hl(o.manifesto, d.shared_terms)}</div></div><div class="xs mut">Shared distinctive words: ${d.shared_terms.map(t => esc(t.term)).join(", ") || "none"}</div>` : '<div class="empty">No other manifesto to compare with.</div>'}<button class="btn block" style="margin-top:8px" data-act="closeModal">Close</button>`);
  } catch (e) { toast(e.message, true); }
}
function hl(text, terms) { let h = esc(text); const ws = terms.map(t => t.term).filter(w => /^[\w']+$/.test(w)); if (!ws.length) return h; return h.replace(new RegExp("\\b(" + ws.join("|") + ")\\b", "gi"), '<mark class="hl">$1</mark>'); }
async function voterDialog(sn) {
  try {
    const p = await api("/admin/voters/" + encodeURIComponent(sn) + "/profile");
    modal(`<h3>${esc(p.full_name)}</h3><div class="xs mut mono">${esc(p.student_number)} | ${esc(p.program)} | ${esc(p.respondent_code || "")}</div><div class="sm" style="margin:8px 0">${p.online ? '<span class="tag ok">Online</span>' : '<span class="tag">Offline</span>'} Last sign-in: ${p.last_login ? esc(localTime(p.last_login)) : "never"}</div><div class="sm"><b>${p.positions_voted} of ${p.positions_total}</b> positions voted</div>
    ${p.votes.map(v => `<div class="card" style="padding:8px 10px"><div class="sm"><b>${esc(v.position)}</b>: ${esc(v.candidate_name)}</div><div class="mono xs mut" style="word-break:break-all">${esc(v.transaction_id)}</div></div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="btn out red grow" data-act="resetPw" data-id="${esc(sn)}">Reset password</button><button class="btn grow" data-act="closeModal">Close</button></div><div id="pwOut"></div>`);
  } catch (e) { toast(e.message, true); }
}

/* ---------- events ---------- */
const A = {
  portal: t => { S.portal = t.dataset.v; render(); }, toLogin: () => { S.stage = "login"; render(); },
  login: doLogin, otp: doOtp,
  theme: () => { setTheme(isDark() ? "light" : "dark"); const keepU = $("#sn") ? $("#sn").value : null, keepP = $("#pw") ? $("#pw").value : null; render(); if (keepU !== null) { $("#sn").value = keepU; $("#pw").value = keepP; } },
  showPw: t => { const i = $("#pw"); const show = i.type === "password"; i.type = show ? "text" : "password"; t.innerHTML = show ? ICON.eyeoff : ICON.eye; t.setAttribute("aria-label", show ? "Hide password" : "Show password"); }, fillOtp: () => { $("#otp").value = S.devOtp; },
  logout, help: () => modal(`<h3>How to use VotEra</h3><div class="sm pre">Candidates: read profiles and select one per position.
Compare: see scores side by side or use Match me.
Review ballot, then Confirm. A vote cannot be changed.
Results: live tally and your receipts (Transaction IDs).
This is a research prototype with fictional data.</div><button class="btn block" style="margin-top:10px" data-act="closeModal">Close</button>`),
  tab: t => { S.tab = t.dataset.v; closeSheets(); render(); }, sub: t => { S.sub = t.dataset.v; render(); },
  posf: t => { S.posFilter = t.dataset.v; render(); }, nextPos: t => { S.posFilter = posKey(t.dataset.v); render(); },
  open: t => openDetail(+t.dataset.id), closeDetail: () => { const d = $("#detail"); if (d) d.remove(); render(); },
  pick: t => { const c = S.cands.find(x => x.id === +t.dataset.id), k = posKey(c.position); if (S.picks[k] === c.id) delete S.picks[k]; else S.picks[k] = c.id; const d = $("#detail"); if (d) d.remove(); render(); toast(S.picks[k] ? "Selected " + c.full_name : "Selection removed"); },
  review: reviewBallot, confirmVote, closeModal,
  proof: t => modal(`<div class="proof" data-photo="p:${t.dataset.id}" style="height:60vh;width:100%;background-size:contain;background-repeat:no-repeat"></div><div class="sm" style="margin-top:6px"><b>${esc(t.dataset.cap)}</b></div><div class="xs mut">${esc(t.dataset.src)}</div><button class="btn block" style="margin-top:8px" data-act="closeModal">Close</button>`),
  matchMode: t => { S.match = t.dataset.v === "1"; render(); },
  cmpTog: t => { const id = +t.dataset.id, i = S.compare.indexOf(id); if (i >= 0) S.compare.splice(i, 1); else S.compare.push(id); render(); },
  postCat: t => { S.postCat = t.dataset.v; render(); },
  copy: t => { try { navigator.clipboard.writeText(t.dataset.v); toast("Copied"); } catch (e) { toast("Copy failed", true); } },
  verifyTx: async () => { const o = $("#txOut"); try { const r = await api("/vote/verify?tx=" + encodeURIComponent($("#tx").value.trim())); o.innerHTML = r.valid ? `<span class="tag ok">Valid</span> ${esc(r.position)} recorded ${esc(localTime(r.cast_at))}${r.yours ? " for " + esc(r.candidate_name) : ""}` : `<span class="tag red">Not found</span> ${esc(r.message)}`; } catch (e) { o.textContent = e.message; } },
  setStatus: async t => { try { S.election = await api("/admin/election/status", {method: "PUT", body: {status: t.dataset.v}}); S.electionAt = Date.now(); toast("Status: " + t.dataset.v); render(); } catch (e) { toast(e.message, true); } },
  sched: async t => { try { S.election = await api("/admin/election/schedule", {method: "PUT", body: {minutes: +t.dataset.v || null}}); S.electionAt = Date.now(); toast(+t.dataset.v ? "Will close automatically" : "Cleared"); render(); } catch (e) { toast(e.message, true); } },
  recompute: async () => { try { await api("/admin/credibility/recompute", {method: "POST"}); toast("Scores recomputed"); refresh(true); } catch (e) { toast(e.message, true); } },
  scores: t => scoresForm(+t.dataset.id),
  saveScores: async t => { try { await api(`/admin/candidates/${t.dataset.id}/scores`, {method: "PUT", body: {achievements_score: +$("#s1").value || 0, leadership_score: +$("#s2").value || 0, community_score: +$("#s3").value || 0}}); closeModal(); toast("Saved"); refresh(true); } catch (e) { toast(e.message, true); } },
  sim: t => simDialog(+t.dataset.id),
  pub: async t => { const c = S.cands.find(x => x.id === +t.dataset.id); try { await api(`/admin/candidates/${c.id}/published`, {method: "PUT", body: {published: c.published === false}}); refresh(true); } catch (e) { toast(e.message, true); } },
  more: () => { S.vShow += 60; render(); }, voter: t => voterDialog(t.dataset.id),
  resetPw: async t => { try { const r = await api(`/admin/voters/${encodeURIComponent(t.dataset.id)}/reset-password`, {method: "POST"}); $("#pwOut").innerHTML = `<div class="note">New password (shown once): <b class="mono">${esc(r.password)}</b></div>`; } catch (e) { toast(e.message, true); } },
  endSess: async t => { try { await api(`/admin/sessions/${encodeURIComponent(t.dataset.id)}/end`, {method: "POST"}); toast("Signed out"); refresh(true); } catch (e) { toast(e.message, true); } },
  runTest: async () => { S.busy = true; render(); try { S.selftest = await api("/admin/selftest"); } catch (e) { toast(e.message, true); } S.busy = false; render(); },
  newPost: postForm, feedback: feedbackDialog,
  sendFb: async () => { try { await api("/feedback", {method: "POST", body: {ease: +$("#fb_ease").value, clarity: +$("#fb_clarity").value, trust: +$("#fb_trust").value, overall: +$("#fb_overall").value, comment: $("#fb_c").value}}); closeModal(); toast("Thank you for your feedback"); } catch (e) { toast(e.message, true); } },
  savePost: async () => { const t = $("#pt").value.trim(); if (!t) return toast("Enter a title", true); try { await api("/announcements", {method: "POST", body: {title: t, body: $("#pb").value, category: $("#pc").value, pinned: $("#pp").checked, publish_in_minutes: +$("#pw2").value || null}}); closeModal(); toast("Posted"); refresh(true); } catch (e) { toast(e.message, true); } },
  pinPost: async t => { const p = S.posts.find(x => x.id === +t.dataset.id); try { await api("/admin/announcements/" + p.id, {method: "PUT", body: {pinned: !p.pinned}}); refresh(true); } catch (e) { toast(e.message, true); } },
  delPost: async t => { if (!confirm("Delete this update?")) return; try { await api("/admin/announcements/" + t.dataset.id, {method: "DELETE"}); refresh(true); } catch (e) { toast(e.message, true); } }
};
document.addEventListener("click", ev => {
  if (ev.target.closest("[data-in]") && !ev.target.closest("[data-act]")) return;
  const t = ev.target.closest("[data-act]"); if (!t) return; if (t.disabled) return;
  const fn = A[t.dataset.act]; if (fn) { ev.stopPropagation(); fn(t); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter") { if (S.stage === "login" && ev.target.closest(".login")) doLogin(); else if (S.stage === "otp") doOtp(); } });
function keepFocus(fn) { const el = document.activeElement, id = el && el.id, pos = el && el.selectionStart; fn(); if (id) { const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } } }
document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-in]"); if (!el) return; const k = el.dataset.in;
  if (k === "query") { S.query = el.value; const l = $("#list"); if (l) { l.innerHTML = candList(); hydrate(); } }
  else if (k === "vQuery") { S.vQuery = el.value; S.vShow = 60; keepFocus(render); }
  else if (k === "prio") { S.prio[+el.dataset.i] = +el.value; const pv = $("#pv" + el.dataset.i); if (pv) pv.textContent = el.value; const l = $("#matchList"); if (l) { const keep = $("main").scrollTop; render(); $("main").scrollTop = keep; } }
});
document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-in]"); if (!el) return; const k = el.dataset.in;
  if (k === "sort") { S.sort = el.value; render(); } else if (k === "cmpPos") { S.cmpPos = el.value; S.compare = []; render(); }
  else if (k === "vFilter") { S.vFilter = el.value; S.vShow = 60; render(); } else if (k === "vProg") { S.vProg = el.value; S.vShow = 60; render(); }
  else if (k === "onlyProblems") { S.onlyProblems = el.checked; loadAdmin().then(render); }
});

/* ---------- start ---------- */
setInterval(() => { const c = $("#cd"); if (c) c.textContent = countdown(); }, 1000);
setInterval(() => { if (S.token && !document.hidden) refresh(true); }, 60000);
let wakeTimer = setTimeout(() => { S.waking = true; if (S.stage === "login") render(); }, 2500);
fetch(API + "/health").then(() => { clearTimeout(wakeTimer); S.waking = false; if (S.stage === "login") render(); }).catch(() => {});
render();
if (S.token) { refresh(true); connectWs(); }
</script></body></html>
